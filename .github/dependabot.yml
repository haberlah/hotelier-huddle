version: 2
updates:
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Cloudflare Worker npm dependencies
  - package-ecosystem: "npm"
    directory: "/cloudflare_worker"
    schedule:
      interval: "weekly"

  # Maintain MCP Server Python dependencies
  - package-ecosystem: "pip"
    directory: "/mcp_server"
    schedule:
      interval: "weekly"
