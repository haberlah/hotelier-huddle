[project]
name = "hotelier-huddle-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for The Hotelier Huddle podcast knowledge base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<3",
]

[project.scripts]
hotelier-huddle-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
